apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  annotations:
    openshift.io/display-name: RedHatAI/gpt-oss-20b
  labels:
    opendatahub.io/dashboard: 'true'
    opendatahub.io/genai-asset: 'true'
  name: redhataigpt-oss-20b
  namespace: models-as-a-service
spec:
  baseRefs:
  - name: redhataigpt-oss-20b
  model:
    name: redhataigpt-oss-20b
    uri: oci://registry.redhat.io/rhelai1/modelcar-gpt-oss-20b:1.5
  replicas: 1
  router:
    gateway:
      refs:
      - name: maas-default-gateway
        namespace: openshift-ingress
    route: {}
  template:
    containers:
    - env:
      - name: VLLM_ADDITIONAL_ARGS
        value: --enable-auto-tool-choice --tool-call-parser  openai
      name: main
      resources:
        limits:
          cpu: '2'
          memory: 8Gi
          nvidia.com/gpu: '1'
        requests:
          cpu: '2'
          memory: 8Gi
          nvidia.com/gpu: '1'
    nodeSelector:
      node-role.kubernetes.io/worker-gpu: ''
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
---
