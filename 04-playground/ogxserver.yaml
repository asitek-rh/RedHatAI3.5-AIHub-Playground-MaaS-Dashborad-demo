apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  annotations:
    openshift.io/display-name: lsd-genai-playground
  labels:
    opendatahub.io/dashboard: "true"
  name: lsd-genai-playground
  namespace: models-as-a-service
spec:
  distribution:
    name: rh-dev
  network:
    port: 8321
  overrideConfig:
    key: config.yaml
    name: llama-stack-config
  workload:
    overrides:
      command:
      - /bin/sh
      - -c
      - ogx run /etc/ogx/config.yaml --insecure
      env:
      - name: VLLM_TLS_VERIFY
        value: "false"
      - name: FAISS_STORE_DIR
        value: ~/.llama/faiss
      - name: SENTENCE_TRANSFORMERS_HOME
        value: /opt/app-root/.cache/huggingface/hub
      - name: HF_HUB_OFFLINE
        value: "0"
      - name: TRANSFORMERS_OFFLINE
        value: "0"
      - name: HF_DATASETS_OFFLINE
        value: "0"
      - name: VLLM_MAX_TOKENS_1
        value: "4096"
      - name: VLLM_API_TOKEN_1
        value: fake
      - name: VLLM_MAX_TOKENS_2
        value: "4096"
      - name: VLLM_API_TOKEN_2
        value: fake
      - name: PGVECTOR_HOST
        value: genai-pgvector.models-as-a-service.svc.cluster.local
      - name: PGVECTOR_PORT
        value: "5432"
      - name: PGVECTOR_DB
        value: vectordb
      - name: PGVECTOR_USER
        value: vectoruser
      - name: PGVECTOR_PASSWORD
        valueFrom:
          secretKeyRef:
            key: password
            name: genai-pgvector-credentials
      - name: OGX_CONFIG_DIR
        value: /opt/app-root/src/.ogx/distributions/rh/
    replicas: 1
    resources:
      limits:
        cpu: "2"
        memory: 12Gi
      requests:
        cpu: 250m
        memory: 500Mi
  availableReplicas: 1
  conditions:
  - lastTransitionTime: "2026-11-10T07:45:15Z"
    message: Declarative config generation is not active
    reason: ConfigGenerationInactive
    type: ConfigGenerated
  - lastTransitionTime: "2026-11-10T07:45:15Z"
    message: Deployment is ready
    reason: DeploymentReady
    type: DeploymentReady
  - lastTransitionTime: "2026-11-10T07:45:15Z"
    message: Service is ready
    reason: ServiceReady
    type: ServiceReady
  - lastTransitionTime: "2026-11-10T07:45:15Z"
    message: Health check passed
    reason: HealthCheckPassed
    type: HealthCheck
  distributionConfig:
    activeDistribution: rh-dev
    availableDistributions:
      rh: registry.redhat.io/rhoai/odh-ogx-core-rhel9@sha256:a96caf4e5dfbe8ee9f1c342f2c1ab7200ce39d6ef464375718ac0313bc97dd5d
      rh-dev: registry.redhat.io/rhoai/odh-ogx-core-rhel9@sha256:a96caf4e5dfbe8ee9f1c342f2c1ab7200ce39d6ef464375718ac0313bc97dd5d
    providers:
    - api: inference
      config:
        trust_remote_code: false
      health:
        message: Provider does not implement health check
      provider_id: sentence-transformers
      provider_type: inline::sentence-transformers
    - api: inference
      config:
        api_token: '********'
        base_url: https://maas.apps.ocp.pvtxr.sandbox3461.opentlc.com/v1
        max_tokens: 4096
        tls_verify: false
      health:
        message: Provider does not implement health check
      provider_id: maas-vllm-inference-1
      provider_type: remote::vllm
    - api: inference
      config:
        api_token: '********'
        base_url: https://maas.apps.ocp.pvtxr.sandbox3461.opentlc.com/v1
        max_tokens: 4096
        tls_verify: false
      health:
        message: Provider does not implement health check
      provider_id: maas-vllm-inference-2
      provider_type: remote::vllm
    - api: vector_io
      config:
        db: vectordb
        distance_metric: COSINE
        host: genai-pgvector.models-as-a-service.svc.cluster.local
        password: '********'
        persistence:
          backend: kv_default
          namespace: vector_io::pgvector
        port: 5432
        user: vectoruser
      health:
        message: Provider does not implement health check
      provider_id: pgvector
      provider_type: remote::pgvector
    - api: responses
      config:
        persistence:
          responses:
            backend: sql_default
            max_write_queue_size: 10000
            num_writers: 4
            table_name: responses
      health:
        message: Provider does not implement health check
      provider_id: builtin
      provider_type: inline::builtin
    - api: file_processors
      config: {}
      health:
        message: Provider does not implement health check
      provider_id: pypdf
      provider_type: inline::pypdf
    - api: files
      config:
        metadata_store:
          backend: sql_default
          table_name: files_metadata
        storage_dir: /opt/app-root/src/.llama/distributions/rh/files
      health:
        message: Provider does not implement health check
      provider_id: localfs-files
      provider_type: inline::localfs
    - api: tool_runtime
      config: {}
      health:
