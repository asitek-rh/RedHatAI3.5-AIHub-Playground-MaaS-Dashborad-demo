      provider_id: model-context-protocol
      provider_type: remote::model-context-protocol
  phase: Ready
  serviceURL: http://lsd-genai-playground-service.models-as-a-service.svc.cluster.local:8321
  version:
    lastUpdated: "2026-11-10T07:45:15Z"
    operatorVersion: '"0.13.0"'
    serverVersion: 1.2.5.1+rhaiv.0
